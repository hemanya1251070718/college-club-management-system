{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="app-container">
  <header class="inner-page-header">
    <div class="inner-header-layout">
      <div>
        <h1 class="inner-page-title">{{ title }}</h1>
        <p class="inner-page-subtitle">Configure campus initiative lifecycle, budget allocations, and venue scheduling.</p>
      </div>
      <div>
        <a href="{{ url_for('main.list_events') }}" class="btn-tesla-secondary">
          <i class="bi bi-arrow-left me-1"></i> Back to Events
        </a>
      </div>
    </div>
  </header>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="tesla-card">
        <form method="POST">
          <div class="row g-4">
            <div class="col-md-4">
              <label class="tesla-form-label">Event ID *</label>
              <input type="text" name="event_id" class="tesla-form-control font-mono text-uppercase" placeholder="e.g. CSI26-HACK" value="{{ event.event_id if event else '' }}" {% if event %}readonly{% endif %} required>
            </div>
            <div class="col-md-8">
              <label class="tesla-form-label">Host Club *</label>
              <select name="club_id" class="tesla-form-select" required>
                <option value="" disabled {% if not event %}selected{% endif %}>Select host club...</option>
                {% for c in clubs %}
                <option value="{{ c.club_id }}" {% if event and event.club_id == c.club_id %}selected{% endif %}>
                  {{ c.club_name }} ({{ c.club_id }})
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="tesla-form-label">Event Name *</label>
              <input type="text" name="event_name" class="tesla-form-control" placeholder="e.g. Hackathon 2026" value="{{ event.event_name if event else '' }}" required>
            </div>

            <div class="col-md-6">
              <label class="tesla-form-label">Event Date</label>
              <input type="date" name="event_date" class="tesla-form-control tabular-nums" value="{{ event.event_date if event and event.event_date else '' }}">
            </div>
            <div class="col-md-6">
              <label class="tesla-form-label">Venue</label>
              <input type="text" name="venue" class="tesla-form-control" placeholder="e.g. Main Auditorium / Lab 5" value="{{ event.venue if event and event.venue else '' }}">
            </div>

            <div class="col-md-4">
              <label class="tesla-form-label">Budget (₹)</label>
              <input type="number" step="0.01" name="budget_allocated" class="tesla-form-control tabular-nums" placeholder="0.00" value="{{ event.budget_allocated if event else '0' }}">
            </div>
            <div class="col-md-4">
              <label class="tesla-form-label">Event Type</label>
              <input type="text" name="event_type" class="tesla-form-control" placeholder="e.g. Workshop / Contest" value="{{ event.event_type if event and event.event_type else '' }}">
            </div>
            <div class="col-md-4">
              <label class="tesla-form-label">Status *</label>
              <select name="status" class="tesla-form-select" required>
                <option value="Planned" {% if not event or event.status == 'Planned' %}selected{% endif %}>Planned</option>
                <option value="Ongoing" {% if event and event.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                <option value="Completed" {% if event and event.status == 'Completed' %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if event and event.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
              </select>
            </div>
          </div>

          <hr class="my-4" style="border-color: var(--border);">

          <div class="d-flex justify-content-end gap-3">
            <a href="{{ url_for('main.list_events') }}" class="btn-tesla-secondary" style="min-width: 140px;">Cancel</a>
            <button type="submit" class="btn-tesla-primary" style="min-width: 180px;">
              <i class="bi bi-save me-2"></i> Save Event
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold">{{ title }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Event ID *</label>
              <input type="text" name="event_id" class="form-control text-uppercase" placeholder="e.g. CSI26-HACK" value="{{ event.event_id if event else '' }}" {% if event %}readonly{% endif %} required>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">Host Club *</label>
              <select name="club_id" class="form-select" required>
                <option value="" disabled {% if not event %}selected{% endif %}>Select host club...</option>
                {% for c in clubs %}
                <option value="{{ c.club_id }}" {% if event and event.club_id == c.club_id %}selected{% endif %}>
                  {{ c.club_name }} ({{ c.club_id }})
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Event Name *</label>
              <input type="text" name="event_name" class="form-control" placeholder="e.g. Hackathon 2026" value="{{ event.event_name if event else '' }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Event Date</label>
              <input type="date" name="event_date" class="form-control" value="{{ event.event_date if event and event.event_date else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Venue</label>
              <input type="text" name="venue" class="form-control" placeholder="e.g. Main Auditorium / Lab 5" value="{{ event.venue if event and event.venue else '' }}">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Budget (₹)</label>
              <input type="number" step="0.01" name="budget_allocated" class="form-control" placeholder="0.00" value="{{ event.budget_allocated if event else '0' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Event Type</label>
              <input type="text" name="event_type" class="form-control" placeholder="e.g. Workshop / Contest" value="{{ event.event_type if event and event.event_type else '' }}">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Status *</label>
              <select name="status" class="form-select" required>
                <option value="Planned" {% if not event or event.status == 'Planned' %}selected{% endif %}>Planned</option>
                <option value="Ongoing" {% if event and event.status == 'Ongoing' %}selected{% endif %}>Ongoing</option>
                <option value="Completed" {% if event and event.status == 'Completed' %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if event and event.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
              </select>
            </div>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('main.list_events') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i> Save Event
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

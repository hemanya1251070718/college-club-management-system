{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold">{{ title }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Club ID *</label>
              <input type="text" name="club_id" class="form-control text-uppercase" placeholder="e.g. CSI" value="{{ club.club_id if club else '' }}" {% if club %}readonly{% endif %} required>
              <small class="text-muted">Unique short code (PK)</small>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">Club Name *</label>
              <input type="text" name="club_name" class="form-control" placeholder="Computer Society of India" value="{{ club.club_name if club else '' }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Category *</label>
              <select name="category" class="form-select" required>
                <option value="" disabled {% if not club %}selected{% endif %}>Select category...</option>
                <option value="Technical" {% if club and club.category == 'Technical' %}selected{% endif %}>Technical</option>
                <option value="Cultural" {% if club and club.category == 'Cultural' %}selected{% endif %}>Cultural</option>
                <option value="Social" {% if club and club.category == 'Social' %}selected{% endif %}>Social</option>
                <option value="Entrepreneurship" {% if club and club.category == 'Entrepreneurship' %}selected{% endif %}>Entrepreneurship</option>
                <option value="Sports" {% if club and club.category == 'Sports' %}selected{% endif %}>Sports</option>
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Faculty Coordinator *</label>
              <select name="faculty_id" class="form-select" required>
                <option value="" disabled {% if not club %}selected{% endif %}>Assign coordinator...</option>
                {% for f in coordinators %}
                <option value="{{ f.faculty_id }}" {% if club and club.faculty_id == f.faculty_id %}selected{% endif %}>
                  {{ f.name }} ({{ f.dept_name }})
                </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Description</label>
              <textarea name="description" class="form-control" rows="3" placeholder="Brief overview of the club's mission...">{{ club.description if club else '' }}</textarea>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Official Email</label>
              <input type="email" name="official_email" class="form-control" placeholder="club@vit.edu" value="{{ club.official_email if club else '' }}">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Instagram Handle</label>
              <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="text" name="instagram_handle" class="form-control" placeholder="vit_club" value="{{ club.instagram_handle if club else '' }}">
              </div>
            </div>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('main.list_clubs') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i> Save Club
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

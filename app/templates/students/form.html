{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold">{{ title }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Student ID *</label>
              <input type="text" name="student_id" class="form-control text-uppercase" placeholder="e.g. CE25-0999" value="{{ student.student_id if student else '' }}" {% if student %}readonly{% endif %} required>
              <small class="text-muted">Format: DeptYear-Roll</small>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">PRN Number *</label>
              <input type="text" name="prn_number" class="form-control" placeholder="e.g. 1251070999" value="{{ student.prn_number if student else '' }}" {% if student %}readonly{% endif %} required>
            </div>

            <div class="col-12">
              <label class="form-label fw-semibold">Full Name *</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. Aarav Sharma" value="{{ student.name if student else '' }}" required>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address *</label>
              <input type="email" name="email" class="form-control" placeholder="aarav.sharma@vit.edu" value="{{ student.email if student else '' }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="text" name="phone" class="form-control" placeholder="10-digit mobile" value="{{ student.phone if student and student.phone else '' }}">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold">Dept Code *</label>
              <input type="text" name="dept_id" class="form-control text-uppercase" placeholder="CE" value="{{ student.dept_id if student else '' }}" required>
            </div>
            <div class="col-md-5">
              <label class="form-label fw-semibold">Department Name *</label>
              <input type="text" name="dept_name" class="form-control" placeholder="Computer Engineering" value="{{ student.dept_name if student else '' }}" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Year *</label>
              <select name="year_of_study" class="form-select" required>
                <option value="1" {% if student and student.year_of_study == 1 %}selected{% endif %}>1st Year</option>
                <option value="2" {% if student and student.year_of_study == 2 %}selected{% endif %}>2nd Year</option>
                <option value="3" {% if student and student.year_of_study == 3 %}selected{% endif %}>3rd Year</option>
                <option value="4" {% if student and student.year_of_study == 4 %}selected{% endif %}>4th Year</option>
              </select>
            </div>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('main.list_students') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i> Save Student
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

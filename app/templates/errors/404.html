{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 text-primary fw-bold">404</div>
    <h3 class="fw-bold mb-3">Resource Not Found</h3>
    <p class="text-muted mb-4">
      The requested endpoint or record does not exist in this database system.
    </p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}

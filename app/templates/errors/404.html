{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="app-container">
  <div class="row justify-content-center text-center py-5">
    <div class="col-md-6 py-5">
      <div class="tabular-nums fw-medium mb-3" style="font-size: 84px; color: var(--blue-400); line-height: 1;">404</div>
      <h1 class="inner-page-title mb-3">Resource Not Found</h1>
      <p class="text-secondary mb-5">
        The requested endpoint or record does not exist in this database system.
      </p>
      <a href="{{ url_for('main.dashboard') }}" class="btn-tesla-primary">
        <i class="bi bi-house-door me-2"></i> Return to Cockpit
      </a>
    </div>
  </div>
</div>
{% endblock %}

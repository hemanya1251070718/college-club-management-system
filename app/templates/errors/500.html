{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 text-danger fw-bold">500</div>
    <h3 class="fw-bold mb-3">Internal Service Error</h3>
    <p class="text-muted mb-4">
      An unexpected error occurred while processing the database query. For security, stack traces are suppressed in production.
    </p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}

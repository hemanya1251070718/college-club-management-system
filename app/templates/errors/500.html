{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="app-container">
  <div class="row justify-content-center text-center py-5">
    <div class="col-md-6 py-5">
      <div class="tabular-nums fw-medium mb-3" style="font-size: 84px; color: var(--danger); line-height: 1;">500</div>
      <h1 class="inner-page-title mb-3">Internal Service Error</h1>
      <p class="text-secondary mb-5">
        An unexpected error occurred while processing the database query. For security, stack traces are suppressed in production.
      </p>
      <a href="{{ url_for('main.dashboard') }}" class="btn-tesla-primary">
        <i class="bi bi-house-door me-2"></i> Return to Cockpit
      </a>
    </div>
  </div>
</div>
{% endblock %}
